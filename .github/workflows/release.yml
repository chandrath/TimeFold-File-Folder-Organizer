name: Release TimeFold

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0 or 1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version Tag
        id: get_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:INPUT_VERSION) {
            $tag = $env:INPUT_VERSION
          } else {
            $tag = "v1.0.0"
          }
          $ver = $tag.TrimStart('v','V')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "ver=$ver" >> $env:GITHUB_OUTPUT

      # ── Build 1: Self-Contained (ReadyToRun / Standalone) ──────────────────
      - name: Build — Self-Contained (Portable + Installer)
        shell: pwsh
        run: |
          dotnet publish src/TimeFold.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -o ./publish_ready_to_run

      # ── Build 2: Framework-Dependent (Lightweight) ────────────────────────
      - name: Build — Framework-Dependent (Portable + Installer)
        shell: pwsh
        run: |
          dotnet publish src/TimeFold.csproj -c Release -r win-x64 --no-self-contained `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false `
            -p:DebugType=none -o ./publish_requires_dotnet

      # ── Install Inno Setup ────────────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # ── Package Artifacts ─────────────────────────────────────────────────
      - name: Create Release Artifacts
        shell: pwsh
        run: |
          $tag = "${{ steps.get_version.outputs.tag }}"
          $ver = "${{ steps.get_version.outputs.ver }}"

          # Remove PDBs
          Remove-Item -Path ./publish_ready_to_run/*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item -Path ./publish_requires_dotnet/*.pdb -Force -ErrorAction SilentlyContinue

          # ── Self-Contained Portable ZIP ──────────────────────────────────
          $scPortableDir = "./publish_ready_to_run"
          $scExeSrc = "$scPortableDir/TimeFold.exe"
          $scPortableZip = "TimeFold-${tag}-win-x64-Portable.zip"
          Compress-Archive -Path "$scExeSrc" -DestinationPath "./$scPortableZip"

          # ── Framework-Dependent Portable ZIP ─────────────────────────────
          $fdPortableDir = "./publish_requires_dotnet"
          $fdExeSrc = "$fdPortableDir/TimeFold.exe"
          $fdPortableZip = "TimeFold-${tag}-win-x64-Portable-ReqDotNet10.zip"
          Compress-Archive -Path "$fdExeSrc" -DestinationPath "./$fdPortableZip"

          # ── Self-Contained Installer ──────────────────────────────────────
          New-Item -ItemType Directory -Path ./publish_installer -Force | Out-Null
          Copy-Item "$scExeSrc" -Destination "./publish_installer/TimeFold.exe"
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DMyAppVersion=$ver" `
            "/O." `
            "installer\timefold.iss"
          # ISCC outputs: TimeFold-{ver}-win-x64-Setup.exe

          # ── Framework-Dependent Installer ────────────────────────────────
          Copy-Item "$fdExeSrc" -Destination "./publish_installer/TimeFold.exe" -Force
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DMyAppVersion=$ver" `
            "/DOutputBaseName=TimeFold-${tag}-win-x64-Setup-ReqDotNet10" `
            "/O." `
            "installer\timefold.iss"

          # ── Checksums ────────────────────────────────────────────────────
          $files = @(
            "TimeFold-${tag}-win-x64-Setup.exe",
            "TimeFold-${tag}-win-x64-Setup-ReqDotNet10.exe",
            "TimeFold-${tag}-win-x64-Portable.zip",
            "TimeFold-${tag}-win-x64-Portable-ReqDotNet10.zip"
          )
          $lines = foreach ($f in $files) {
            if (Test-Path "./$f") { "$(( Get-FileHash -Path ./$f -Algorithm SHA256 ).Hash)  $f" }
          }
          $lines | Out-File -FilePath "./checksums.txt" -Encoding utf8

      # ── Publish GitHub Release ────────────────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "TimeFold ${{ steps.get_version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### ⬇️ Which file should I download?

            | File | Who it's for |
            |---|---|
            | **`TimeFold-${{ steps.get_version.outputs.tag }}-win-x64-Setup.exe`** | ✅ Recommended — Windows installer, no .NET required |
            | **`TimeFold-${{ steps.get_version.outputs.tag }}-win-x64-Portable.zip`** | Portable — extract and run, no installation needed |
            | `TimeFold-${{ steps.get_version.outputs.tag }}-win-x64-Setup-ReqDotNet10.exe` | Installer (tiny, requires [.NET 10 Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)) |
            | `TimeFold-${{ steps.get_version.outputs.tag }}-win-x64-Portable-ReqDotNet10.zip` | Portable (tiny, requires [.NET 10 Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)) |

            > **Tip for release notes in-app:** Wrap your short summary between `<!-- timefold-summary-start -->` and `<!-- timefold-summary-end -->` above this table — TimeFold will display it in the update notification.
          files: |
            TimeFold-*.exe
            TimeFold-*.zip
            checksums.txt
